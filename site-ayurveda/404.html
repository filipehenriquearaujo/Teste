<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página não encontrada</title>

  <!--
    O GitHub mostra esta página para qualquer endereço que não existe,
    em qualquer pasta. Por isso os links começam com "/Teste/" (o nome do repositório).
    Se mudar o nome do repositório, troque "/Teste/" aqui.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/Teste/css/estilo.css">
</head>
<body>

  <header class="topo">
    <div class="container">
      <a href="/Teste/" class="logo">Luísa<span>.</span></a>
    </div>
  </header>

  <main class="pagina-404">
    <div class="emoji">🍃</div>
    <h1>Página não encontrada</h1>
    <p>O endereço que você procurou não existe ou mudou de lugar. Respire fundo e volte para o início.</p>
    <a href="/Teste/" class="botao">Voltar para o início</a>
  </main>

</body>
</html>
